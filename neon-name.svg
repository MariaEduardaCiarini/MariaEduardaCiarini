<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" rx="18" fill="#0d0714"/>

  <g filter="url(#neon)">
    <text x="450" y="100" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif"
          font-size="58" font-weight="800" fill="#ff5fc8" stroke="#ffd1ef" stroke-width="1">
      Maria Eduarda Ciarini
      <animate attributeName="opacity" values="1;0.75;1;0.9;1;0.6;1" dur="3.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="152" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="22" fill="#c9a0ff" letter-spacing="3">
    Desenvolvedora Jr • Suporte Técnico • Python • Java
    <animate attributeName="opacity" values="0;1" dur="2s" begin="0.5s" fill="freeze"/>
  </text>

  <line x1="200" y1="175" x2="700" y2="175" stroke="#ff5fc8" stroke-width="3" stroke-linecap="round" filter="url(#neon)">
    <animate attributeName="x1" values="450;200" dur="1.5s" fill="freeze"/>
    <animate attributeName="x2" values="450;700" dur="1.5s" fill="freeze"/>
  </line>
</svg>
